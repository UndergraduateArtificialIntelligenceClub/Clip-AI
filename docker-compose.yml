# Local Postgres (with pgvector) and Redis. Start with: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clipai
      POSTGRES_PASSWORD: clipai
      POSTGRES_DB: clipai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
